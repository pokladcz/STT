<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stavba a provoz strojů (SPS) | Výukový portál</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23fbf8f3'/%3E%3Ctext x='12' y='17' font-family='Georgia,serif' font-size='12' font-weight='700' fill='%23b0561f' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #fbf8f3; }
    a { color: inherit; text-decoration: none; }
  
    @media (max-width: 900px) { #cardsContainer { grid-template-columns: repeat(2, 1fr) !important; } }
    @media (max-width: 600px) { #cardsContainer { grid-template-columns: 1fr !important; } }
    /* Fix header wrapping */
    h1 { font-size: 32px !important; }
    
  </style>
  <script>
    document.addEventListener('mouseover', function(e){ var el = e.target.closest('.site-nav-toggle'); if (el) el.style.maxHeight = el.scrollHeight + 'px'; });
    document.addEventListener('mouseout', function(e){ var el = e.target.closest('.site-nav-toggle'); if (el && !el.contains(e.relatedTarget)) el.style.maxHeight = '48px'; });
  </script>
</helmet>
<div class="site-nav-toggle" style="position:fixed;top:24px;right:24px;z-index:1000;width:220px;background:#fff;border:1px solid #e5ded2;border-radius:16px;box-shadow:0 2px 10px rgba(35,29,22,0.08);overflow:hidden;max-height:48px;transition:max-height 0.22s ease">
  <div style="height:48px;display:flex;align-items:center;justify-content:center;gap:5px;flex-direction:column;cursor:pointer">
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
    <span style="width:20px;height:2px;background:#5c5346;border-radius:1px"></span>
  </div>
  <div style="display:flex;flex-direction:column;border-top:1px solid #eee5d8">
    <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
      <a href="{{ n.href }}" style="padding:12px 18px;font-family:'Quicksand',sans-serif;font-weight:600;font-size:14px;color:#231d16" style-hover="background:#fbf8f3">{{ n.title }}</a>
    </sc-for>
  </div>
</div>
<div style="min-height:100vh;background:#fbf8f3;font-family:'IBM Plex Sans',sans-serif;padding:64px 48px 80px;box-sizing:border-box">
  <div style="max-width:1080px;margin:0 auto 48px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;margin:0 0 8px">
      <h1 style="font-family:'Quicksand',sans-serif;font-weight:700;font-size:44px;line-height:1.15;color:#231d16;margin:0">Výuka: Stavba a provoz strojů (SPS)</h1>
      <a href="../o-projektu.html" style="display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;font-weight:500;color:#8a8072;text-decoration:none;border-bottom:1px solid #ded3c2;padding-bottom:2px" style-hover="color:#231d16;border-bottom-color:#231d16">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 11v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.8" r="1.2" fill="currentColor"/></svg>
        O&nbsp;projektu
      </a>
    </div>
    
    <div style="font-family:'IBM Plex Sans',sans-serif;font-size:18px;color:#5c5346;margin-bottom:24px;font-weight:500;">
      Vyberte si materiál nebo kapitolu
    </div>

    <div style="margin-bottom: 32px;">
      <input type="text" id="searchInput" placeholder="Hledat materiály..." style="width:100%; max-width:500px; padding:14px 18px; border-radius:12px; border:1px solid #ded3c2; font-family:'IBM Plex Sans',sans-serif; font-size:16px; box-shadow:0 2px 8px rgba(0,0,0,0.03); outline:none;" onkeyup="filterCards()">
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:10px">
      <div style="display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#d4f0ff;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:500;color:#004d77">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="13" rx="2" stroke="#005b95" stroke-width="2"/><path d="M8 21h8M12 17v4" stroke="#005b95" stroke-width="2" stroke-linecap="round"/></svg>
        Optimalizováno pro PC
      </div>
      <div style="display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#d4f1d4;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:500;color:#15561d">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 8V4h4M21 8V4h-4M3 16v4h4M21 16v4h-4" stroke="#146720" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Tip: F11 pro celou obrazovku
      </div>
    </div>
  </div>

  <div id="cardsContainer" style="max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:28px">

    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="5">
      <sc-if value="{{ c.ready }}">
        <a href="{{ c.href }}" target="{{ c.target }}" rel="{{ c.rel }}" class="subject-card" data-title="{{ c.title }}" style="{{ c.cardStyle }}" style-hover="box-shadow:0 8px 24px rgba(35,29,22,0.1);transform:translateY(-2px)">
          <div style="{{ c.iconBoxStyle }}" dangerouslySetInnerHTML="{{ c.icon }}"></div>
          <div style="{{ c.titleStyle }}">{{ c.title }}</div>
        </a>
      </sc-if>
      <sc-if value="{{ c.notReady }}">
        <div class="subject-card" data-title="{{ c.title }}" style="{{ c.cardStyle }}">
          <div style="position:absolute;top:16px;right:16px;padding:5px 10px;border-radius:999px;background:#eee5d8;font-size:11px;font-weight:600;font-family:'IBM Plex Sans',sans-serif;color:#a39a8b;letter-spacing:0.04em;text-transform:uppercase">Připravujeme</div>
          <div style="{{ c.iconBoxStyle }}" dangerouslySetInnerHTML="{{ c.icon }}"></div>
          <div style="{{ c.titleStyle }}">{{ c.title }}</div>
        </div>
      </sc-if>
    </sc-for>

  </div>
</div>

</x-dc>
<script>
function filterCards() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const cards = document.querySelectorAll('.subject-card');
  cards.forEach(card => {
    const title = card.getAttribute('data-title').toLowerCase();
    if(title.includes(query)) {
      card.style.display = 'flex';
    } else {
      card.style.display = 'none';
    }
  });
}
</script>
<script type="text/x-dc" data-dc-script>
const ICON_META = {

  'sps': { bg: '#eee5d8', svg: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M3 21l7-7" stroke="#b3a996" stroke-width="2" stroke-linecap="round"/><path d="M13 11l6.5-6.5a2.1 2.1 0 0 1 3 3L16 14" stroke="#b3a996" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="15" r="2.4" stroke="#b3a996" stroke-width="2"/></svg>' },
  'mec': { bg: '#ffe2d9', svg: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M12 3c3 4 6 6.5 6 10.5A6 6 0 1 1 6 13.5C6 9.5 9 7 12 3z" stroke="#c0401f" stroke-width="2" stroke-linejoin="round"/></svg>' },
  'robotika': { bg: '#cee9fd', svg: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none"><rect x="8.4" y="2" width="7.2" height="3.4" rx="1.2" stroke="#006495" stroke-width="1.8"/><path d="M10.3 5.4v2.1h3.4V5.4" stroke="#006495" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.6 7.5h4.8v4.3L12 14.5 9.6 11.8V7.5z" stroke="#006495" stroke-width="1.8" stroke-linejoin="round"/><path d="M10.1 9.4l3.8-1.1M10.1 11.4l3.8-1.1" stroke="#006495" stroke-width="1.2" stroke-linecap="round"/><path d="M4.5 17.3h3.6l1.9-2.1 1.9 2.1h7.6" stroke="#699fc5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 1.7"/><path d="M3 20.3h18" stroke="#006495" stroke-width="1.8" stroke-linecap="round"/></svg>' },
  'cnc': { bg: '#cee9fd', svg: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none"><rect x="2.2" y="7" width="3.6" height="10" rx="1.2" stroke="#006495" stroke-width="1.8"/><path d="M2.2 10.3h3.6M2.2 13.7h3.6" stroke="#006495" stroke-width="1.2" stroke-linecap="round"/><path d="M5.8 9.4h10.4v5.2H5.8z" stroke="#006495" stroke-width="1.8" stroke-linejoin="round"/><path d="M1.6 12h20.8" stroke="#699fc5" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 1.7"/><path d="M18.4 16.1l2.3 3.5h-4.6z" stroke="#006495" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 21.2h18" stroke="#006495" stroke-width="1.8" stroke-linecap="round"/></svg>' },
  'mte': { bg: '#eee5d8', svg: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M2.5 8.5h8v3.2l-1.8 1.6v3.4H4.3v-3.4L2.5 11.7V8.5z" stroke="#b3a996" stroke-width="1.8" stroke-linejoin="round"/><path d="M6.5 17v4" stroke="#b3a996" stroke-width="1.8" stroke-linecap="round"/><path d="M13 6.5h8.5v5.6a4.25 4.25 0 0 1-8.5 0V6.5z" stroke="#b3a996" stroke-width="1.8" stroke-linejoin="round"/><path d="M15.4 3c-.7.9-.7 1.8 0 2.7M18.9 3c-.7.9-.7 1.8 0 2.7" stroke="#b3a996" stroke-width="1.4" stroke-linecap="round"/></svg>' },
  'doc': { bg: '#fff0e5', svg: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="#d97736" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 2v6h6" stroke="#d97736" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 13H8M16 17H8M10 9H8" stroke="#d97736" stroke-width="2" stroke-linecap="round"/></svg>' },
  'vnitrni-stavba': { bg: '#fdd4c6', svg: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M9 3v11a4 4 0 1 0 6 0V3" stroke="#bb4717" stroke-width="2" stroke-linecap="round"/><path d="M9 7h6" stroke="#bb4717" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="2.8" fill="#bb4717"/></svg>' },
  'koroze': { bg: '#ffe2d9', svg: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M12 3c3 4 6 6.5 6 10.5A6 6 0 1 1 6 13.5C6 9.5 9 7 12 3z" stroke="#c0401f" stroke-width="2" stroke-linejoin="round"/></svg>' },
  'tvareni': { bg: '#f8d7be', svg: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M1.5 2c1 1.3 1 2.7 0 4s-1 2.7 0 4" stroke="#bd413f" stroke-width="1.5" stroke-linecap="round"/><path d="M22.5 2c-1 1.3-1 2.7 0 4s1 2.7 0 4" stroke="#bd413f" stroke-width="1.5" stroke-linecap="round"/><path d="M6 4v6M18 4v6" stroke="#b25400" stroke-width="2" stroke-linecap="round"/><path d="M4 10h16l-2 4H6l-2-4z" stroke="#b25400" stroke-width="2" stroke-linejoin="round"/><path d="M8 18h8" stroke="#b25400" stroke-width="2" stroke-linecap="round"/></svg>' },
  'praskova-metalurgie': { bg: '#e8e9ff', svg: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none"><circle cx="7" cy="4.6" r="1.5" fill="#5d55a9"/><circle cx="12" cy="6.4" r="1.1" fill="#5d55a9"/><circle cx="16.8" cy="4.4" r="1.3" fill="#5d55a9"/><circle cx="9.6" cy="9" r="1" fill="#5d55a9"/><circle cx="14.6" cy="9.4" r="1.4" fill="#5d55a9"/><path d="M4 13.5h16v6H4v-6z" stroke="#5d55a9" stroke-width="1.8" stroke-linejoin="round"/><path d="M6.5 13.5v-2M17.5 13.5v-2" stroke="#5d55a9" stroke-width="1.8" stroke-linecap="round"/></svg>' },
  'znaceni-oceli': { bg: '#d9ecdf', svg: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M5 3h9l5 5v13H5V3z" stroke="#2e7d57" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5" stroke="#2e7d57" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 12h8M8 15.5h8M8 19h5" stroke="#2e7d57" stroke-width="1.6" stroke-linecap="round"/></svg>' },
  'odlevani': { bg: '#f8ddc9', svg: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M3.5 3.5h7.5l2.4 4.1-2.6 2.1L3.5 8V3.5z" stroke="#b0561f" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.4 7.6c-1.1 2.3-1.5 4.3-1.5 6.4" stroke="#b0561f" stroke-width="1.6" stroke-linecap="round"/><path d="M6.5 16.5h11l-1.4 5H7.9l-1.4-5z" stroke="#b0561f" stroke-width="1.8" stroke-linejoin="round"/><path d="M6.5 16.5h11" stroke="#b0561f" stroke-width="1.8" stroke-linecap="round"/></svg>' }
};

class Component extends DCLogic {
  state = { structure: null };
  componentDidMount() {
    fetch('../site-structure.json?v=' + new Date().getTime()).then(r => r.json()).then(structure => this.setState({ structure })).catch(() => {});
  }
  renderVals() {
    const s = this.state.structure;
    let inPreview = false;
    try { inPreview = window.self !== window.top; } catch (e) { inPreview = true; }
    
    const navItems = s ? s.nav.map(n => ({
        title: n.title,
        href: n.href === 'index.html' || n.href === 'o-projektu.html' ? '../' + n.href : '../' + n.href
    })) : [];

    const cardsData = s ? s.spsCards : [];
    const cards = cardsData.map(c => {
      const ready = c.status === 'ready' || !c.status;
      const meta = ICON_META[c.id] || ICON_META['doc'];
      return {
        title: c.title,
        href: c.href,
        target: c.target || (c.newWindow && !inPreview ? '_blank' : undefined),
        rel: c.newWindow && !inPreview ? 'noopener' : undefined,
        icon: { __html: meta.svg },
        ready,
        notReady: !ready,
        cardStyle: (ready
          ? 'display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;background:#fff;border-radius:24px;padding:44px 28px;border:1px solid #e5ded2;box-shadow:0 1px 3px rgba(35,29,22,0.06);cursor:pointer;transition:box-shadow 0.15s,transform 0.15s'
          : 'position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;background:#faf7f1;border-radius:24px;padding:44px 28px;border:1px solid #ece4d6;cursor:not-allowed'),
        iconBoxStyle: `width:96px;height:96px;border-radius:22px;background:${ready ? meta.bg : '#eee5d8'};display:flex;align-items:center;justify-content:center`,
        titleStyle: `font-family:'Quicksand',sans-serif;font-weight:700;font-size:22px;line-height:1.3;color:${ready ? '#231d16' : '#a39a8b'}`,
      };
    });
    return { navItems, cards };
  }
}
</script>
</body>
</html>
